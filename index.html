<header><strong>STAND FIRM &amp; ACT LIKE MEN</strong><nav id="nav"></nav></header>
<section class="cover"><div class="kicker">A REPEATABLE 7-WEEK MEN'S DISCIPLESHIP PROGRAM</div><h1>STAND <span class="muted">FIRM</span></h1><p>Be watchful. Stand firm in the faith. Act like men. Be strong. Let all that you do be done in love.</p><p class="note">1 Corinthians 16:13–14</p></section>
<main id="lessons"></main><footer class="end">WE WANT ALL MEN TO SEE AND HEAR THE TRUTH.</footer>
